services:
  db:
    image: pgvector/pgvector:pg16
    container_name: hotel_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASS}
      POSTGRES_DB: ${POSTGRES_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # "$$" escapes "$" so the variable is expanded inside the container, not by compose.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: hotel_app
    env_file: .env
    environment:
      # Inside the compose network the database is reachable by its service name.
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    ports:
      - "8080:8000"  # 8080 on the host, so it doesn't clash with `fastapi dev` on 8000
    depends_on:
      db:
        condition: service_healthy  # wait until Postgres accepts connections, not just "started"


volumes:
  pgdata:
